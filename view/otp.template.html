<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OTP Verification</title>
</head>

<body style="
    margin: 0;
    padding: 0;
    background-color: #f4f7fb;
    font-family: Arial, sans-serif;
">

    <table width="100%" cellpadding="0" cellspacing="0" style="padding: 40px 0;">
        <tr>
            <td align="center">

                <table width="500" cellpadding="0" cellspacing="0" style="
                    background: #ffffff;
                    border-radius: 10px;
                    overflow: hidden;
                    box-shadow: 0 8px 30px rgba(0,0,0,0.08);
                ">

                    <!-- Header -->
                    <tr>
                        <td style="
                            background: linear-gradient(135deg, #4f46e5, #7c3aed);
                            padding: 35px;
                            text-align: center;
                        ">

                            <h1 style="
                                color: white;
                                margin: 0;
                                font-size: 28px;
                                letter-spacing: 1px;
                            ">
                                Inc-Exp
                            </h1>

                            <p style="
                                color: rgba(255,255,255,0.85);
                                margin-top: 10px;
                                font-size: 14px;
                            ">
                                Secure OTP Verification
                            </p>

                        </td>
                    </tr>

                    <!-- Body -->
                    <tr>
                        <td style="padding: 40px;">

                            <p style="
                                color: #6b7280;
                                line-height: 1.7;
                                font-size: 15px;
                            ">
                                Use the verification code below to continue
                                accessing your account securely.
                            </p>

                            <!-- App Logo -->
                            <img src="https://inc-exp.onrender.com/app-icon.png" alt="Inc-Exp Logo" width="80"
                                height="80" style="
                                    display: block;
                                    margin: 0 auto 15px auto;
                                    border-radius: 20px;
                                    object-fit: cover;
                                " />

                            <h1 style="
                                color: white;
                                margin: 0;
                                font-size: 28px;
                                letter-spacing: 1px;
                            ">
                                Inc-Exp
                            </h1>

                            <!-- OTP Box -->
                            <div style="
                                margin: 35px 0;
                                text-align: center;
                            ">

                                <span style="
                                    display: inline-block;
                                    background: #4e6aa5;
                                    color: white;
                                    padding: 18px 35px;
                                    border-radius: 8px;
                                    font-size: 34px;
                                    font-weight: bold;
                                    letter-spacing: 10px;
                                    box-shadow: 0 4px 15px rgba(0,0,0,0.15);
                                ">
                                    {{OTP}}
                                </span>

                            </div>

                            <p style="
                                color: #9ca3af;
                                font-size: 14px;
                                line-height: 1.6;
                            ">
                                This OTP will expire in
                                <strong>5 minutes</strong>.
                            </p>

                            <p style="
                                color: #9ca3af;
                                font-size: 14px;
                                line-height: 1.6;
                            ">
                                If you did not request this code, you can safely
                                ignore this email.
                            </p>

                        </td>
                    </tr>

                    <!-- Footer -->
                    <tr>
                        <td style="
                            padding: 25px;
                            text-align: center;
                            background: #f9fafb;
                            border-top: 1px solid #e5e7eb;
                        ">

                            <p style="
                                margin: 0;
                                color: #9ca3af;
                                font-size: 13px;
                            ">
                                © 2026 Inc-Exp
                            </p>

                        </td>
                    </tr>

                </table>

            </td>
        </tr>
    </table>

</body>

</html>
