<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OTP Verification</title>
</head>

<body style="
    margin:0;
    padding:0;
    background:#f5f7fa;
    font-family:Arial, Helvetica, sans-serif;
">

    <table width="100%" cellpadding="0" cellspacing="0" style="padding:40px 20px;">
        <tr>
            <td align="center">

                <table width="500" cellpadding="0" cellspacing="0" style="
                    background:#ffffff;
                    border:1px solid #e5e7eb;
                    border-radius:12px;
                ">

                    <!-- Header -->
                    <tr>
                        <td align="center" style="
                            padding:30px;
                            background:#2563eb;
                            border-radius:12px 12px 0 0;
                        ">
                            <h1 style="
                                margin:0;
                                color:#ffffff;
                                font-size:28px;
                            ">
                                INC-EXP
                            </h1>

                            <p style="
                                margin:10px 0 0 0;
                                color:#dbeafe;
                                font-size:14px;
                            ">
                                Email Verification
                            </p>
                        </td>
                    </tr>

                    <!-- Content -->
                    <tr>
                        <td style="padding:40px;">

                            <h2 style="
                                margin-top:0;
                                color:#111827;
                            ">
                                Verify Your Email
                            </h2>

                            <p style="
                                color:#4b5563;
                                line-height:1.6;
                            ">
                                Use the following One-Time Password (OTP) to continue.
                            </p>

                            <div style="
                                text-align:center;
                                margin:35px 0;
                            ">
                                <span style="
                                    display:inline-block;
                                    background:#2563eb;
                                    color:#ffffff;
                                    font-size:32px;
                                    font-weight:bold;
                                    padding:16px 30px;
                                    border-radius:8px;
                                    letter-spacing:8px;
                                ">
                                    {{OTP}}
                                </span>
                            </div>

                            <p style="
                                color:#4b5563;
                                line-height:1.6;
                            ">
                                This OTP is valid for <strong>1 minutes</strong>.
                            </p>

                            <p style="
                                color:#4b5563;
                                line-height:1.6;
                            ">
                                If you did not request this verification code, please ignore this email.
                            </p>

                        </td>
                    </tr>

                    <!-- Footer -->
                    <tr>
                        <td align="center" style="
                            padding:20px;
                            border-top:1px solid #e5e7eb;
                            background:#f9fafb;
                        ">
                            <p style="
                                margin:0;
                                color:#6b7280;
                                font-size:12px;
                            ">
                                © 2026 INC-EXP. All rights reserved.
                            </p>
                        </td>
                    </tr>

                </table>

            </td>
        </tr>
    </table>

</body>

</html>
